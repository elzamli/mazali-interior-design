services:
  - type: web
    name: mazali-design
    runtime: static
    buildCommand: echo "static site - no build"
    staticPublishPath: .
    headers:
      # images/css/js: let browsers cache for a week
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
